<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>City Pulse — Discover Amazing Events Near You</title>
    <meta
      name="description"
      content="Discover, book, and experience the best events in your city. Concerts, workshops, conferences and more."
    />
    <meta name="author" content="City Pulse" />

    <!-- Performance: Resource Hints for Faster External Resource Loading -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://upload-widget.cloudinary.com">

    <!-- SEO & Social -->
    <meta property="og:title" content="City Pulse — Discover Amazing Events" />
    <meta
      property="og:description"
      content="Discover, book, and experience the best events in your city."
    />
    <meta property="og:type" content="website" />
    <!-- Absolute production URL — social crawlers (Facebook, WhatsApp, X,
         LinkedIn) read this tag without executing JavaScript, so the image
         cannot be resolved from the runtime origin. Source file:
         frontend/public/images/concert-crowd-silhouette.jpg (1200×800). -->
    <meta property="og:image" content="https://citypulse360.com/images/concert-crowd-silhouette.jpg" />
    <meta property="og:image:url" content="https://citypulse360.com/images/concert-crowd-silhouette.jpg" />
    <meta property="og:image:secure_url" content="https://citypulse360.com/images/concert-crowd-silhouette.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="City Pulse — live events, concerts and experiences near you" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CityPulse" />
    <meta name="twitter:image" content="https://citypulse360.com/images/concert-crowd-silhouette.jpg" />
    <meta name="twitter:image:alt" content="City Pulse — live events, concerts and experiences near you" />

    <!-- PWA Primary Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance: Lazy Load Cloudinary Widget (Defer Non-Critical Scripts) -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript" defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
